name: Build libpkl

# libpkl isn't published by the Pkl project yet, so we build it from source. See libpkl/README.md.
on:
  workflow_dispatch:
  pull_request:
    paths:
    - libpkl/**
    - .github/workflows/build-libpkl.yml

jobs:
  build:
    name: libpkl ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - { rid: linux-x64,   os: ubuntu-24.04,     arch: x64 }
        - { rid: linux-arm64, os: ubuntu-24.04-arm, arch: arm64 }
        - { rid: osx-arm64,   os: macos-latest,     arch: arm64 }
        - { rid: win-x64,     os: windows-latest,   arch: x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: temurin
        architecture: ${{ matrix.arch }}

    - uses: gradle/actions/setup-gradle@v5

    - name: Install Linux build dependencies
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y build-essential zlib1g-dev

    - name: Set up MSVC
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Build libpkl (Unix)
      if: runner.os != 'Windows'
      run: ./libpkl/build.sh

    - name: Build libpkl (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: ./libpkl/build.ps1

    - uses: actions/upload-artifact@v7
      with:
        name: libpkl-${{ matrix.rid }}
        path: artifacts/libpkl/${{ matrix.rid }}
        if-no-files-found: error
